[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai-docsearch"
version = "0.1.0"
description = "A local command-line search tool for text and PDF documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<3"]
license = "MIT"
keywords = ["document-search", "pdf", "cli", "information-retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/Soumyakanta-Sahoo/SentinelAI"
Repository = "https://github.com/Soumyakanta-Sahoo/SentinelAI"
Issues = "https://github.com/Soumyakanta-Sahoo/SentinelAI/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1"]
release = ["build>=1,<2", "twine>=6,<7"]

[project.scripts]
sentinelai = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.sample_documents" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
